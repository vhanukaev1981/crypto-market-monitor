<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRAME-IN Opportunity Pilot</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7f6;color:#173149}*{box-sizing:border-box}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#fff;border:1px solid #e2e9e6;border-radius:18px;padding:20px;box-shadow:0 10px 30px #0000000d}.login .card{width:min(420px,100%)}h1,h2,h3{margin:0 0 12px}.muted{color:#71808b;font-size:13px;line-height:1.5}input,button{font:inherit}input{width:100%;padding:12px;border:1px solid #ccd7d2;border-radius:10px;margin:6px 0 12px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.green{background:#0b9b66;color:#fff}.soft{background:#eaf8f2;color:#087a52}.gray{background:#edf1ef;color:#40505b}.red{background:#fff0f0;color:#b83e3e}.wrap{max-width:1200px;margin:auto;padding:18px}.top{background:#fff;border-bottom:1px solid #e2e9e6;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button.active{background:#0b9b66;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid #e2e9e6;border-radius:14px;padding:15px}.stat b{font-size:24px}.opp{background:#fff;border:1px solid #e2e9e6;border-radius:14px;padding:15px;margin:10px 0;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;cursor:pointer}.score{width:52px;height:52px;border-radius:12px;background:#eaf8f2;color:#087a52;display:grid;place-items:center;font-weight:900;font-size:19px}.pill{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#eef2f4}.high{background:#eaf8f2;color:#087a52}.medium{background:#fff5df;color:#9d6a0b}.detail{display:grid;grid-template-columns:1.4fr .8fr;gap:14px}.section{border-top:1px solid #edf1ef;padding-top:13px;margin-top:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.contact{background:#f8faf9;border-radius:12px;padding:12px}.err{background:#fff0f0;color:#a23d3d;padding:10px;border-radius:10px;margin-top:10px}.lead{background:#fff;border:1px solid #e2e9e6;border-radius:12px;padding:13px;margin:8px 0}.toast{position:fixed;left:18px;bottom:18px;background:#173149;color:#fff;padding:10px 14px;border-radius:10px;z-index:9}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}.opp{grid-template-columns:54px 1fr}.opp>:last-child{grid-column:2}}</style></head><body><div id="login" class="login"><div class="card"><h1>FRAME-IN</h1><div class="muted">פיילוט חי של מנוע ההזדמנויות. כניסה עם משתמש FRAME-IN הקיים.</div><form id="lf"><input id="em" type="email" placeholder="אימייל" required><input id="pw" type="password" placeholder="סיסמה" required><button class="btn green" style="width:100%">כניסה</button><div id="le" class="err hide"></div></form></div></div><div id="app" class="hide"><div class="top"><b>FRAME-IN CRM</b><span id="ue" class="muted"></span></div><div class="wrap"><div class="tabs"><button class="btn green active" data-p="opps">הזדמנויות</button><button class="btn gray" data-p="leads">לידים חיים</button><button class="btn gray" id="out">יציאה</button></div><div id="view"></div></div></div><div id="toast" class="toast hide"></div><script>const SB='https://gihclnmhnaztkzlpdwwe.supabase.co',KEY='sb_publishable_g6c0EGGqiO7UsINv5My_Aw_cfmiyDrF';let s=JSON.parse(localStorage.getItem('fis')||'null'),opps=[],leads=[];const $=q=>document.querySelector(q),e=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function t(x){let n=$('#toast');n.textContent=x;n.classList.remove('hide');setTimeout(()=>n.classList.add('hide'),3000)}async function af(path,opt={}){let h={apikey:KEY,Authorization:'Bearer '+s.access_token,...(opt.headers||{})},r=await fetch(SB+path,{...opt,headers:h});if(!r.ok)throw Error((await r.text())||r.status);let z=await r.text();return z?JSON.parse(z):null}async function signin(mail,pass){let r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:mail,password:pass})});if(!r.ok)throw Error('פרטי הכניסה אינם נכונים');s=await r.json();localStorage.setItem('fis',JSON.stringify(s))}async function load(){opps=await af('/rest/v1/OpportunityInbox?select=*&order=opportunity_score.desc');leads=await af('/rest/v1/LiveLeadInbox?select=*&order=created_at.desc');renderOpps()}function stats(){let hi=opps.filter(x=>x.priority==='HIGH').length,avg=opps.length?Math.round(opps.reduce((a,b)=>a+b.opportunity_score,0)/opps.length):0;return `<div class="stats"><div class="stat"><span class="muted">הזדמנויות</span><br><b>${opps.length}</b></div><div class="stat"><span class="muted">HIGH</span><br><b>${hi}</b></div><div class="stat"><span class="muted">ציון ממוצע</span><br><b>${avg}</b></div><div class="stat"><span class="muted">לידים חיים</span><br><b>${leads.length}</b></div></div>`}function pc(p){return p==='HIGH'?'high':p==='MEDIUM'?'medium':''}function renderOpps(){tabs('opps');$('#view').innerHTML=`<h2>הזדמנויות עסקיות</h2><div class="muted">נתונים חיים מתוך Supabase של FRAME-IN</div>${stats()}${opps.map(o=>`<div class="opp" onclick="detail('${o.opportunity_id}')"><div class="score">${o.opportunity_score}</div><div><b>${e(o.company_name)}</b><div class="muted">${e(o.project_name||'')} · ${e(o.location||'')}</div><div class="muted">${e(o.why_now||'')}</div></div><span class="pill ${pc(o.priority)}">${e(o.priority)}</span></div>`).join('')}` }async function detail(id){$('#view').innerHTML='<div class="card">טוען...</div>';let d=(await af('/rest/v1/OpportunityDetail?id=eq.'+encodeURIComponent(id)+'&select=*'))[0],c=(d.contacts||[])[0];$('#view').innerHTML=`<button class="btn gray" onclick="renderOpps()">← חזרה</button><div class="detail" style="margin-top:12px"><div class="card"><div style="display:flex;justify-content:space-between"><div><h2>${e(d.company_name)}</h2><div class="muted">${e(d.project_name||'')} · ${e(d.location||'')}</div></div><div class="score">${d.opportunity_score}</div></div><div class="actions"><button class="btn green" onclick="review('${d.id}','APPROVED')">אשר</button><button class="btn gray" onclick="review('${d.id}','SAVED')">שמור</button><button class="btn red" onclick="review('${d.id}','REJECTED')">לא רלוונטי</button><button class="btn soft" ${c?'':'disabled'} onclick="draft('${d.id}','${c?c.id:''}')">צור טיוטת פנייה</button></div><div class="section"><h3>למה מתאים</h3>${e(d.why_fit)}</div><div class="section"><h3>למה עכשיו</h3>${e(d.why_now)}</div><div class="section"><h3>פעולה מומלצת</h3>${e(d.recommended_action)}</div><div class="section"><h3>מקורות</h3>${(d.evidence||[]).map(x=>`<div><b>${e(x.title)}</b><div class="muted">${e(x.summary||'')}</div>${x.source_url?`<a target="_blank" href="${e(x.source_url)}">פתח מקור</a>`:''}</div>`).join('<hr>')}</div><div class="section"><h3>טיוטות</h3>${(d.outreach_drafts||[]).map(x=>`<div class="contact">${e(x.subject||'')}<br><br>${e(x.body||'')}</div>`).join('')||'<span class="muted">אין עדיין</span>'}</div></div><div class="card"><h3>איש קשר</h3>${c?`<div class="contact"><b>${e(c.name)}</b><div class="muted">${e(c.job_title||'')}</div>${c.business_email?`<div>${e(c.business_email)}</div>`:''}${c.linkedin_url?`<a target="_blank" href="${e(c.linkedin_url)}">LinkedIn</a>`:''}</div>`:'<div class="muted">לא נמצא איש קשר</div>'}<div class="section"><b>סטטוס:</b> ${e(d.review_status)}<br><b>עדיפות:</b> ${e(d.priority)}<br><b>Contactability:</b> ${d.contactability_score}</div></div></div>`}async function review(id,status){try{await af('/rest/v1/Opportunity?id=eq.'+id,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({review_status:status})});t('הסטטוס עודכן');await load();detail(id)}catch(x){t('שגיאה: '+x.message)}}async function draft(id,cid){try{await af('/rest/v1/rpc/generate_opportunity_outreach_draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p_opportunity_id:id,p_contact_id:cid,p_channel:'EMAIL'})});t('טיוטה נוצרה');detail(id)}catch(x){t('שגיאה: '+x.message)}}function renderLeads(){tabs('leads');$('#view').innerHTML=`<h2>לידים חיים</h2><div class="muted">Customer + Lead אמיתיים מתוך FRAME-IN</div>${stats()}${leads.map(l=>`<div class="lead"><b>${e(l.customer_name)}</b> · ${e(l.status)}<div class="muted">${e(l.phone_primary||'')} · ${e(l.email||'')} · מקור: ${e(l.lead_source)}</div>${l.opportunity_company?`<div class="muted">הגיע ממנוע הזדמנויות: ${e(l.opportunity_company)}</div>`:''}</div>`).join('')}` }function tabs(p){document.querySelectorAll('[data-p]').forEach(b=>{b.className='btn '+(b.dataset.p===p?'green active':'gray')})}document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>b.dataset.p==='opps'?renderOpps():renderLeads());$('#lf').onsubmit=async q=>{q.preventDefault();$('#le').classList.add('hide');try{await signin($('#em').value,$('#pw').value);boot()}catch(x){$('#le').textContent=x.message;$('#le').classList.remove('hide')}};$('#out').onclick=()=>{localStorage.removeItem('fis');location.reload()};async function boot(){if(!s)return;$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#ue').textContent=s.user?.email||'';try{await load()}catch(x){t('טעינת נתונים נכשלה: '+x.message)}}if(s)boot();</script></body></html>
