<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CryptoBot Control Center</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color-scheme:dark;--bg:#06101d;--panel:#0b1828;--panel2:#0d1d30;--line:#20344d;--muted:#8ea3bf;--text:#eef5ff;--soft:#bdc9d9;--brand:#58a8ff;--good:#36d399;--warn:#f7b955;--bad:#ff6b7a}*{box-sizing:border-box}html,body,#root{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{background:radial-gradient(circle at 90% -10%,rgba(88,168,255,.12),transparent 32%),radial-gradient(circle at 5% 0%,rgba(124,92,255,.1),transparent 28%),var(--bg)}button{font:inherit}.app{padding:14px}.shell{max-width:1420px;margin:auto}.top{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin-bottom:10px;border:1px solid rgba(91,129,170,.22);background:rgba(8,22,38,.96);backdrop-filter:blur(16px);border-radius:18px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#2a81ff,#7762ff);font-weight:900}.brand h1{margin:0;font-size:18px}.brand p{margin:2px 0 0;color:var(--muted);font-size:10px}.actions{display:flex;gap:6px;align-items:center}.chip,.btn{border:1px solid var(--line);background:#091828;color:var(--soft);border-radius:999px;padding:7px 10px;font-size:10px}.btn{cursor:pointer}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-left:5px}.tabs{display:flex;gap:6px;overflow:auto;padding:2px 0 9px}.tab{white-space:nowrap;border:1px solid transparent;background:transparent;color:var(--muted);padding:8px 10px;border-radius:10px;cursor:pointer;font-size:10px}.tab.active{color:white;background:#10243b;border-color:#284867}.notice{padding:9px 11px;border:1px solid rgba(88,168,255,.2);background:rgba(88,168,255,.06);border-radius:12px;color:#bcdcff;font-size:10px;margin-bottom:10px}.card{border:1px solid rgba(92,126,169,.21);background:linear-gradient(180deg,rgba(14,29,49,.97),rgba(8,21,37,.97));border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.16)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}.kpi{padding:13px}.label{font-size:10px;color:var(--muted);margin-bottom:7px}.value{font-size:22px;font-weight:760}.sub{font-size:9px;color:var(--muted);margin-top:6px;line-height:1.35}.positive{color:var(--good)}.negative{color:var(--bad)}.grid2{display:grid;grid-template-columns:1.3fr .9fr;gap:8px;margin-bottom:8px}.panel{padding:13px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}.title{font-size:12px;font-weight:760}.headsub{font-size:9px;color:var(--muted);margin-top:3px}.badge{border:1px solid var(--line);padding:5px 7px;border-radius:999px;color:var(--soft);font-size:9px}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.stage{padding:10px 7px;border:1px solid #203956;border-radius:11px;background:#091a2c;text-align:center}.stage.active{border-color:rgba(54,211,153,.38)}.stage strong{display:block;font-size:10px}.stage span{display:block;font-size:8px;color:var(--muted);margin-top:4px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;border:1px solid rgba(80,113,151,.17);background:rgba(5,16,29,.43);border-radius:10px}.list{display:flex;flex-direction:column;gap:6px}.rowtitle{font-size:10px;font-weight:650}.rowsub{font-size:8px;color:var(--muted);margin-top:3px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.pill{font-size:8px;padding:4px 6px;border-radius:999px;border:1px solid var(--line)}.pill.good{color:var(--good);border-color:rgba(54,211,153,.28)}.pill.warn{color:var(--warn);border-color:rgba(247,185,85,.28)}.pill.bad{color:var(--bad);border-color:rgba(255,107,122,.28)}.decision{display:grid;grid-template-columns:auto 1fr;gap:9px}.decisionIcon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(88,168,255,.1);border:1px solid rgba(88,168,255,.25);font-weight:850;color:#91c7ff}.reason{font-size:9px;color:var(--soft);line-height:1.55;margin-top:6px}.meta{font-size:8px;color:var(--muted);margin-top:7px;display:flex;gap:7px;flex-wrap:wrap}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:9px}.table th,.table td{padding:9px 8px;text-align:right;border-bottom:1px solid rgba(75,105,140,.16);white-space:nowrap}.table th{color:var(--muted);font-weight:600}.empty{padding:18px;text-align:center;color:var(--muted);font-size:10px}.sources{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.source{padding:9px;border:1px solid rgba(80,113,151,.17);border-radius:10px;background:rgba(5,16,29,.42)}.source strong{font-size:9px}.source span{display:block;font-size:8px;color:var(--muted);margin-top:4px}.error{color:#ffd4d8;border-color:rgba(255,107,122,.35);background:rgba(255,107,122,.08)}.loading{opacity:.6}.footer{padding:8px 2px 0;color:var(--muted);font-size:8px;display:flex;justify-content:space-between}.sectionTitle{font-size:12px;font-weight:750;margin-bottom:8px}.toolbar{display:flex;gap:6px}.smallbtn{cursor:pointer;border:1px solid var(--line);background:#0a1b2d;color:var(--soft);padding:5px 8px;border-radius:8px;font-size:8px}
@media(max-width:720px){.app{padding:8px}.top{padding:11px;border-radius:14px;align-items:flex-start}.brand h1{font-size:14px}.brand p{font-size:8px}.logo{width:34px;height:34px}.actions .optional{display:none}.kpis{grid-template-columns:1fr 1fr;gap:6px}.kpi{padding:10px}.value{font-size:18px}.grid2{grid-template-columns:1fr}.panel{padding:10px}.flow{grid-template-columns:1fr 1fr}.stage:last-child{grid-column:span 2}.sources{grid-template-columns:1fr}.table{font-size:8px}.top{position:sticky}.tabs{scrollbar-width:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
const root=document.getElementById('root');
const state={tab:'overview',data:null,panels:{},loading:false,error:null};
const tabs={overview:'סקירה כללית',algobot:'AlgoBot',bybit:'בוטים של Bybit',portfolio:'תיק ועסקאות',risk:'ניהול סיכון',system:'מצב המערכת'};
const toolFor={overview:'get_dashboard_overview',algobot:'get_algobot_status',bybit:'get_bybit_bots',portfolio:'get_portfolio',risk:'get_risk_status',system:'get_system_health'};
function money(v){return typeof v==='number'&&Number.isFinite(v)?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v):'לא זמין'}
function pct(v){return typeof v==='number'&&Number.isFinite(v)?`${v.toFixed(2)}%`:'לא זמין'}
function num(v,d=6){return typeof v==='number'&&Number.isFinite(v)?v.toLocaleString('en-US',{maximumFractionDigits:d}):'לא זמין'}
function age(v){if(typeof v!=='number')return'זמן לא ידוע';if(v<10)return'עכשיו';if(v<60)return`לפני ${Math.floor(v)} שנ׳`;if(v<3600)return`לפני ${Math.floor(v/60)} דק׳`;return`לפני ${Math.floor(v/3600)} שע׳`}
function freshness(v){return v==='fresh'?'עדכני':v==='aging'?'מתיישן':v==='stale'?'מיושן':'לא זמין'}
function sys(v){return v==='healthy'?'תקין':v==='limited'?'מוגבל':v==='protection'?'הגנה':v==='emergency_stop'?'עצירת חירום':'לא ידוע'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cls(v){return typeof v==='number'?(v>0?'positive':v<0?'negative':''):''}
function structured(result){return result&&typeof result==='object'&&'structuredContent'in result?result.structuredContent:result}
async function callTool(name,args={}){if(window.openai?.callTool)return structured(await window.openai.callTool(name,args));throw new Error('ChatGPT tool bridge לא זמין')}
async function fullscreen(){if(window.openai?.requestDisplayMode)await window.openai.requestDisplayMode({mode:'fullscreen'})}
function save(){window.openai?.setWidgetState?.({tab:state.tab})}
function pill(label,type='good'){return`<span class="pill ${type}">${esc(label)}</span>`}
function kpi(label,value,sub='',c=''){return`<div class="card kpi"><div class="label">${esc(label)}</div><div class="value ${c}">${value}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`}
function empty(t,s=''){return`<div class="empty"><strong>${esc(t)}</strong>${s?`<div class="sub">${esc(s)}</div>`:''}</div>`}
function overview(o){if(!o)return empty('אין תמונת מצב זמינה');const d=o.latest_decision;const sourceEntries=Object.entries(o.sources||{});return`<div class="kpis">${kpi('שווי תיק כולל',money(o.portfolio_equity_usd),'Bybit Mainnet · Read-Only')}${kpi('P&L היום',money(o.pnl?.day_usd),`שבוע: ${money(o.pnl?.week_usd)} · חודש: ${money(o.pnl?.month_usd)}`,cls(o.pnl?.day_usd))}${kpi('פוזיציות פתוחות',o.open_positions??'לא זמין',`הון בפריסה: ${pct(o.deployed_capital_pct)}`)}${kpi('מצב המערכת',sys(o.system_state),`Drawdown: ${pct(o.drawdown_pct)}`,o.system_state==='healthy'?'positive':'')}</div><div class="grid2"><section class="card panel"><div class="head"><div><div class="title">צינור ההחלטה של AlgoBot</div><div class="headsub">האסטרטגיה אינה שולחת פקודה ישירות לבורסה</div></div><span class="badge">Read-Only UI</span></div><div class="flow">${['נתוני שוק','אסטרטגיה','מנוע סיכון','מנהל פקודות','ביצוע'].map((x,i)=>`<div class="stage ${i<3?'active':''}"><strong>${x}</strong><span>${['Market Data',`${o.algobot?.active_strategies??0} אסטרטגיות`,'Guardrails','Order Plan','Mode Gate'][i]}</span></div>`).join('')}</div></section><section class="card panel"><div class="head"><div><div class="title">החלטה אחרונה של AlgoBot</div><div class="headsub">עובדות שמורות בלבד</div></div></div>${d?`<div class="decision"><div class="decisionIcon">AI</div><div><div class="rowtitle">${esc(d.symbol||'לא זמין')} ${pill(d.decision,'warn')}</div><div class="reason">${esc(d.reason||'לא נשמר נימוק מפורט')}</div><div class="meta"><span>${esc(d.strategy||'אסטרטגיה לא ידועה')}</span><span>${d.observed_at?new Date(d.observed_at).toLocaleString('he-IL'):'זמן לא ידוע'}</span><button class="smallbtn" data-explain="${esc(d.id)}">למה?</button></div></div></div>`:empty('אין החלטה שמורה')}</section></div><div class="grid2"><section class="card panel"><div class="head"><div><div class="title">טריות מקורות</div><div class="headsub">כל מקור מדווח בנפרד</div></div></div><div class="sources">${sourceEntries.map(([k,m])=>`<div class="source"><strong>${esc(k)}</strong><span>${freshness(m.freshness_state)} · ${age(m.age_seconds)}</span></div>`).join('')||empty('אין מקורות')}</div></section><section class="card panel"><div class="head"><div><div class="title">התראות</div><div class="headsub">אירועים שדורשים תשומת לב</div></div></div><div class="list">${(o.alerts||[]).length?o.alerts.slice(0,6).map(a=>`<div class="row"><div><div class="rowtitle">${esc(a.title)}</div><div class="rowsub">${esc(a.message)}</div></div>${pill(a.severity,a.severity==='critical'?'bad':a.severity==='warning'?'warn':'good')}</div>`).join(''):empty('אין התראות פעילות')}</div></section></div>`}
function algo(a){if(!a)return empty('נתוני AlgoBot עדיין לא נטענו');return`<section class="card panel"><div class="head"><div><div class="title">אסטרטגיות AlgoBot</div><div class="headsub">מצב, ביצועים ואות אחרון</div></div><span class="badge">${freshness(a.source?.freshness_state)} · ${age(a.source?.age_seconds)}</span></div><div class="tableWrap"><table class="table"><thead><tr><th>אסטרטגיה</th><th>מצב</th><th>סטטוס</th><th>עסקאות</th><th>P&L</th><th>Expectancy</th><th>אות אחרון</th></tr></thead><tbody>${(a.strategies||[]).map(s=>`<tr><td><strong>${esc(s.name)}</strong><div class="rowsub mono">${esc(s.key)}</div></td><td>${esc(s.mode)}</td><td>${esc(s.status)}</td><td>${s.trade_count??'—'}</td><td class="${cls(s.pnl_usd)}">${money(s.pnl_usd)}</td><td>${money(s.expectancy_usd)}</td><td>${esc(s.latest_signal||'לא זמין')}</td></tr>`).join('')}</tbody></table></div></section>`}
function bybit(b){if(!b)return empty('נתוני Bybit עדיין לא נטענו');return`<div class="kpis">${kpi('שווי חשבון Bot',money(b.total_bot_account_equity_usd),'Bybit Read-Only')}${kpi('קטגוריות Bot שזוהו',b.bots?.length??0,esc(b.details_status||''))}${kpi('מסחר מהווידג׳ט','חסום','אין write tools ב-V1','positive')}${kpi('טריות מקור',freshness(b.source?.freshness_state),age(b.source?.age_seconds))}</div><section class="card panel"><div class="head"><div><div class="title">בוטים של Bybit</div><div class="headsub">מציג רק מידע שניתן לאמת</div></div></div>${(b.bots||[]).length?`<div class="tableWrap"><table class="table"><thead><tr><th>קטגוריה</th><th>סוג</th><th>סמל</th><th>ETH שנצפה</th><th>P&L</th><th>טווח</th></tr></thead><tbody>${b.bots.map(x=>`<tr><td>${esc(x.category||'—')}</td><td>${esc(x.kind)}</td><td>${esc(x.symbol||'—')}</td><td>${num(x.observed_eth_quantity,8)}</td><td>לא זמין</td><td>לא זמין</td></tr>`).join('')}</tbody></table></div>`:empty('אין פירוט בוטים מאומת')}</section>`}
function portfolio(p){if(!p)return empty('נתוני התיק עדיין לא נטענו');return`<div class="kpis">${kpi('שווי כולל',money(p.total_equity_usd))}${kpi('נכסים',p.assets?.length??0)}${kpi('פוזיציות פתוחות',p.positions?.length??0)}${kpi('עסקאות אחרונות',p.recent_trades?.length??0)}</div><div class="grid2"><section class="card panel"><div class="head"><div class="title">חלוקת החשבון</div></div><div class="list">${(p.account_breakdown||[]).map(x=>`<div class="row"><div class="rowtitle">${esc(x.account_type)}</div><div class="mono">${money(x.usd_value)}</div></div>`).join('')}</div></section><section class="card panel"><div class="head"><div class="title">נכסים ב-Unified</div></div><div class="list">${(p.assets||[]).slice(0,12).map(x=>`<div class="row"><div><div class="rowtitle">${esc(x.coin)}</div><div class="rowsub">${esc(x.account_type||'')}</div></div><div><div class="mono">${money(x.usd_value)}</div><div class="rowsub mono">${num(x.quantity,8)}</div></div></div>`).join('')||empty('אין נכסים')}</div></section></div>`}
function risk(r){if(!r)return empty('נתוני הסיכון עדיין לא נטענו');return`<div class="kpis">${kpi('חשיפה',money(r.exposure_usd),`מקס׳ לעסקה: ${money(r.max_usd_per_trade)}`)}${kpi('פוזיציות',r.open_positions??'לא זמין',`מקסימום: ${r.max_open_positions??'לא זמין'}`)}${kpi('Kill Switch',r.kill_switch?'פעיל':'לא פעיל',r.native_protection_required?'Native protection required':'')}${kpi('Reconciliation',esc(r.reconciliation_state||'unknown'),`מקור: ${freshness(r.source?.freshness_state)}`)}</div><section class="card panel"><div class="head"><div><div class="title">אירועי סיכון אחרונים</div><div class="headsub">הגנות ונקודות תשומת לב</div></div></div><div class="list">${(r.recent_events||[]).length?r.recent_events.map(e=>`<div class="row"><div><div class="rowtitle">${esc(e.title)}</div><div class="rowsub">${esc(e.message)}</div></div>${pill(e.severity,e.severity==='critical'?'bad':e.severity==='warning'?'warn':'good')}</div>`).join(''):empty('אין אירועי סיכון פעילים')}</div></section>`}
function system(s){if(!s)return empty('נתוני המערכת עדיין לא נטענו');return`<div class="kpis">${kpi('מצב כללי',sys(s.overall_state),'')}${kpi('הרשאת חשבון',s.authorization_mode==='read_only'?'READ ONLY':esc(s.authorization_mode),'','positive')}${kpi('מסחר דרך החיבור',s.exchange_trading_enabled?'פעיל':'חסום','','positive')}${kpi('משיכות',s.withdrawals_enabled?'פעילות':'חסומות','','positive')}</div><section class="card panel"><div class="head"><div><div class="title">רכיבי מערכת</div><div class="headsub">Heartbeat וטריות לכל רכיב</div></div></div><div class="list">${(s.components||[]).map(c=>`<div class="row"><div><div class="rowtitle">${esc(c.label)}</div><div class="rowsub">${esc(c.message||'')}</div></div>${pill(`${c.state} · ${age(c.meta?.age_seconds)}`,c.state==='ok'?'good':c.state==='fault'?'bad':'warn')}</div>`).join('')}</div></section>`}
function view(){const data=state.tab==='overview'?(state.panels.overview||state.data?.overview):(state.panels[state.tab]||state.data?.[state.tab==='bybit'?'bybit_bots':state.tab]);if(state.loading)return`<div class="card panel loading">טוען נתונים…</div>`;if(state.error)return`<div class="notice error">${esc(state.error)}</div>`;return state.tab==='overview'?overview(data):state.tab==='algobot'?algo(data):state.tab==='bybit'?bybit(data):state.tab==='portfolio'?portfolio(data):state.tab==='risk'?risk(data):system(data)}
function render(){root.innerHTML=`<div class="app"><div class="shell"><header class="top"><div class="brand"><div class="logo">CB</div><div><h1>מרכז השליטה של CryptoBot</h1><p>AlgoBot · Bybit · Risk · System Health</p></div></div><div class="actions"><span class="chip"><span class="dot"></span>Read-Only</span><span class="chip optional">Mainnet</span><button id="refresh" class="btn">רענון</button><button id="full" class="btn optional">מסך מלא</button></div></header><nav class="tabs">${Object.entries(tabs).map(([k,v])=>`<button class="tab ${state.tab===k?'active':''}" data-tab="${k}">${v}</button>`).join('')}</nav><div class="notice">הנתונים נטענים דרך MCP מאובטח ומוגבל לקריאה בלבד. נתון מיושן מסומן במפורש ואינו מוצג כ-Live.</div><main>${view()}</main><div class="footer"><span>CryptoBot Control Center V1</span><span>Private · Read-Only</span></div></div></div>`;root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));root.querySelector('#refresh')?.addEventListener('click',()=>load(state.tab,true));root.querySelector('#full')?.addEventListener('click',fullscreen);root.querySelectorAll('[data-explain]').forEach(b=>b.onclick=()=>explain(b.dataset.explain))}
async function switchTab(tab){state.tab=tab;save();render();if(tab!=='overview'&&!state.panels[tab])await load(tab)}
async function load(tab,force=false){state.loading=true;state.error=null;render();try{const data=await callTool(toolFor[tab],{});state.panels[tab]=data;if(tab==='overview'&&state.data)state.data.overview=data}catch(e){state.error=e?.message||String(e)}finally{state.loading=false;render()}}
async function explain(id){try{const d=await callTool('explain_decision',{decision_id:String(id)});const msg=`החלטה ${d.decision_id}: ${d.explanation_he}`;if(window.openai?.sendFollowUpMessage)await window.openai.sendFollowUpMessage({prompt:msg});else alert(msg)}catch(e){state.error=e?.message||String(e);render()}}
const initial=structured(window.openai?.toolOutput);if(initial&&initial.overview)state.data=initial;const saved=window.openai?.widgetState;if(saved?.tab&&tabs[saved.tab])state.tab=saved.tab;render();if(!state.data){state.loading=true;render();callTool('open_control_center',{}).then(d=>{state.data=d;state.loading=false;render()}).catch(e=>{state.error=e?.message||String(e);state.loading=false;render()})}
</script>
</body>
</html>
