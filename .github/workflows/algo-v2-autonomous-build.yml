name: ALGO V2 Autonomous Build

# NOTE (Task 8, autonomous orchestrator): the persistent systemd daemon
# `algobot-autonomous-orchestrator` on algobot-bybit-01 is now the PRIMARY
# scheduler for the P0 pipeline. This hourly workflow is retained only as a
# verification / heartbeat: it runs the orchestrator + legacy planner regression
# and publishes an auditable status artifact. It performs no autonomous
# integration and remains `permissions: contents: read`.

on:
  workflow_dispatch:
  push:
    branches:
      - agent/algobot-p0-persistent-recovery
    paths:
      - '.algo-v2-autonomous-heartbeat'
      - '.github/workflows/algo-v2-autonomous-build.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

defaults:
  run:
    working-directory: crypto-market-monitor-full-source

concurrency:
  group: algo-v2-autonomous-build-p0
  cancel-in-progress: false

jobs:
  autonomous-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          ref: agent/algobot-p0-persistent-recovery
          persist-credentials: false

      - name: Setup Node 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Run autonomous state and planner regression
        run: >-
          node --test
          tests/algo-autonomous-build-state.test.mjs
          tests/algo-autonomous-build-queue.test.mjs
          tests/algo-autonomous-permission-boundary.test.mjs
          tests/algo-autonomous-build-cycle.test.mjs

      - name: Verify autonomous orchestrator modules (heartbeat)
        run: node --test --test-concurrency=1 tests/algo-autonomous-orchestrator-*.test.mjs tests/algo-autonomous-github-reconciler.test.mjs tests/algo-autonomous-claude-dispatch.test.mjs tests/algo-autonomous-ci-gate.test.mjs tests/algo-autonomous-review-gate.test.mjs tests/algo-autonomous-integration-gate.test.mjs

      - name: Orchestrator dry-run heartbeat tick
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation/autonomous-build-artifacts
          # No `|| true`: a crash or a non-zero exit here MUST fail the heartbeat.
          node scripts/run-autonomous-orchestrator.mjs --dry-run --once \
            | tee validation/autonomous-build-artifacts/orchestrator-heartbeat.json
          # Fail if any emitted line is a fatal / safety / unrecoverable signal.
          if grep -Eq '"level":"fatal"|STOP_SAFETY|STOP_UNRECOVERABLE|UNRECOVERABLE_FAILURE|SAFETY_BLOCK' \
              validation/autonomous-build-artifacts/orchestrator-heartbeat.json; then
            echo "::error::orchestrator heartbeat reported a fatal/safety signal"
            exit 1
          fi

      - name: Produce fail-closed cycle decision
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          mkdir -p validation/autonomous-build-artifacts
          node scripts/run-autonomous-build-cycle.mjs \
            --state validation/autonomous-build-state.json \
            --repository vhanukaev1981/crypto-market-monitor \
            --branch agent/algobot-p0-persistent-recovery \
            --head-sha "$HEAD_SHA" \
            --qualification-status MISSING \
            > validation/autonomous-build-artifacts/cycle-plan.json
          cat validation/autonomous-build-artifacts/cycle-plan.json

      - name: Upload auditable cycle decision
        uses: actions/upload-artifact@v4
        with:
          name: algo-v2-autonomous-cycle-${{ github.run_id }}
          path: |
            crypto-market-monitor-full-source/validation/autonomous-build-artifacts/cycle-plan.json
            crypto-market-monitor-full-source/validation/autonomous-build-artifacts/orchestrator-heartbeat.json
          if-no-files-found: error
          retention-days: 14
