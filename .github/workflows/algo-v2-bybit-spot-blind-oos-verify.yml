name: ALGO V2 Bybit Spot Blind OOS Verify

on:
  push:
    branches:
      - agent/algo-v2-core-v1
    paths:
      - '.github/workflows/algo-v2-bybit-spot-blind-oos-verify.yml'
      - 'crypto-market-monitor-full-source/algo/algo-v2-candidate-freeze.mjs'
      - 'crypto-market-monitor-full-source/algo/algo-v2-blind-oos.mjs'
      - 'crypto-market-monitor-full-source/scripts/verify-bybit-spot-blind-oos.mjs'
      - 'crypto-market-monitor-full-source/tests/algo-blind-oos.test.mjs'
      - 'crypto-market-monitor-full-source/tests/algo-workflows.test.mjs'
      - 'crypto-market-monitor-full-source/validation/algo-v2-btcusdt-blind-oos.json'
      - 'crypto-market-monitor-full-source/validation/algo-v2-btcusdt-blind-oos.sha256'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-blind-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Run isolated ALGO unit regression
        working-directory: crypto-market-monitor-full-source
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'rendered-html.test.mjs' -print | sort)
          printf 'Running %s isolated test files\n' "${#files[@]}"
          node --test "${files[@]}"

      - name: Verify committed blind OOS evidence only
        working-directory: crypto-market-monitor-full-source
        run: node scripts/verify-bybit-spot-blind-oos.mjs
