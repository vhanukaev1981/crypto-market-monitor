name: ALGO V2 Bybit Spot Blind OOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blind-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Run isolated ALGO unit regression
        working-directory: crypto-market-monitor-full-source
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'rendered-html.test.mjs' -print | sort)
          printf 'Running %s isolated test files\n' "${#files[@]}"
          node --test "${files[@]}"

      - name: Run canonical BTCUSDT Spot blind OOS exactly once
        working-directory: crypto-market-monitor-full-source
        run: |
          mkdir -p validation-results
          node scripts/run-bybit-spot-blind-oos.mjs \
            --symbol BTCUSDT \
            --out validation-results/BTCUSDT-SPOT-BLIND-OOS.json \
            --digest-out validation-results/BTCUSDT-SPOT-BLIND-OOS.sha256

      - name: Print blind OOS summary
        if: always()
        working-directory: crypto-market-monitor-full-source
        shell: bash
        run: |
          shopt -s nullglob
          for f in validation-results/BTCUSDT-SPOT-BLIND-OOS.*; do
            echo "===== $f ====="
            cat "$f"
          done

      - name: Upload blind OOS artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algo-v2-btc-bybit-spot-blind-oos
          path: crypto-market-monitor-full-source/validation-results/BTCUSDT-SPOT-BLIND-OOS.*
          if-no-files-found: error
