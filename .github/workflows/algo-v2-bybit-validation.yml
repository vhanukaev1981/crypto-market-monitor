name: ALGO V2 Bybit Native Validation

on:
  push:
    branches:
      - agent/algo-v2-core-v1
    paths:
      - .github/workflows/algo-v2-bybit-validation.yml
      - crypto-market-monitor-full-source/validation/bybit-validation-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Run ALGO unit regression
        working-directory: crypto-market-monitor-full-source
        run: node --test tests/*.test.mjs

      - name: Create results directory
        working-directory: crypto-market-monitor-full-source
        run: mkdir -p validation-results

      - name: Validate BTCUSDT on Bybit Spot 1H
        working-directory: crypto-market-monitor-full-source
        run: >-
          node scripts/run-bybit-validation.mjs
          --symbol BTCUSDT
          --start 2023-01-01T00:00:00Z
          --end 2026-08-25T23:00:00Z
          --fee-bps 10
          --spread-bps 2
          --slippage-bps 2
          --out validation-results/BTCUSDT.json

      - name: Validate ETHUSDT on Bybit Spot 1H
        working-directory: crypto-market-monitor-full-source
        run: >-
          node scripts/run-bybit-validation.mjs
          --symbol ETHUSDT
          --start 2023-01-01T00:00:00Z
          --end 2026-08-25T23:00:00Z
          --fee-bps 10
          --spread-bps 2
          --slippage-bps 2
          --out validation-results/ETHUSDT.json

      - name: Print summaries
        if: always()
        working-directory: crypto-market-monitor-full-source
        run: |
          for f in validation-results/*.json; do
            [ -f "$f" ] && { echo "===== $f ====="; cat "$f"; }
          done

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algo-v2-bybit-validation
          path: crypto-market-monitor-full-source/validation-results/*.json
          if-no-files-found: warn
