name: ALGO V2 Bybit Native Validation

on:
  push:
    branches:
      - agent/algo-v2-core-v1
    paths:
      - .github/workflows/algo-v2-bybit-validation.yml
      - crypto-market-monitor-full-source/validation/bybit-validation-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Run isolated ALGO unit regression
        working-directory: crypto-market-monitor-full-source
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'rendered-html.test.mjs' -print | sort)
          printf 'Running %s isolated test files\n' "${#files[@]}"
          node --test "${files[@]}"

      - name: Probe official Bybit MT4 kline archive format
        shell: bash
        run: |
          set -euo pipefail
          url='https://public.bybit.com/kline_for_metatrader4/BTCUSDT/2024/BTCUSDT_15_2024-01-01_2024-01-31.csv.gz'
          echo "===== HEADERS ====="
          curl -L -sS -I --max-time 20 "$url" | grep -Ei '^(HTTP/|content-length:|content-type:|last-modified:|etag:)' || true
          echo "===== FIRST 5 ROWS ====="
          curl -L -sS --max-time 120 "$url" | gzip -dc | head -5

      - name: Probe ETH MT4 archive availability
        shell: bash
        run: |
          set -euo pipefail
          url='https://public.bybit.com/kline_for_metatrader4/ETHUSDT/2024/ETHUSDT_15_2024-01-01_2024-01-31.csv.gz'
          curl -L -sS -I --max-time 20 "$url" | grep -Ei '^(HTTP/|content-length:|content-type:|last-modified:|etag:)' || true
