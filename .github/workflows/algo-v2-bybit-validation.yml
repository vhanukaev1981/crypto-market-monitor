name: ALGO V2 Bybit Native Validation

on:
  push:
    branches:
      - agent/algo-v2-core-v1
    paths:
      - .github/workflows/algo-v2-bybit-validation.yml
      - crypto-market-monitor-full-source/validation/bybit-validation-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Run isolated ALGO unit regression
        working-directory: crypto-market-monitor-full-source
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'rendered-html.test.mjs' -print | sort)
          printf 'Running %s isolated test files\n' "${#files[@]}"
          node --test "${files[@]}"

      - name: Download direct Bybit MT4 60m archives for BTC and ETH, 2023-2024
        working-directory: crypto-market-monitor-full-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive validation-results
          for symbol in BTCUSDT ETHUSDT; do
            : > "archive/${symbol}-60m.csv"
            for year in 2023 2024; do
              base="https://public.bybit.com/kline_for_metatrader4/${symbol}/${year}/"
              html=$(curl -L -sS --max-time 30 "$base")
              mapfile -t files < <(printf '%s' "$html" | grep -oE "${symbol}_60_${year}-[0-9-]+_[0-9-]+\.csv\.gz" | sort -u)
              required=12
              if [ "$year" = "2024" ]; then required=11; fi
              if [ ${#files[@]} -lt $required ]; then
                echo "Expected at least ${required} monthly 60m files for ${symbol} ${year}, got ${#files[@]}" >&2
                exit 2
              fi
              echo "${symbol} ${year}: ${#files[@]} monthly 60m files"
              for file in "${files[@]}"; do
                curl -L -sS --fail --retry 3 --max-time 60 "${base}${file}" | gzip -dc >> "archive/${symbol}-60m.csv"
              done
            done
            echo "${symbol} 60m rows: $(wc -l < archive/${symbol}-60m.csv)"
          done

      - name: Validate BTCUSDT on clean contiguous Bybit 60m segments
        working-directory: crypto-market-monitor-full-source
        run: node scripts/run-bybit-mt4-segment-validation.mjs --symbol BTCUSDT --min-hours 4800 --input archive/BTCUSDT-60m.csv --out validation-results/BTCUSDT.json

      - name: Validate ETHUSDT on clean contiguous Bybit 60m segments
        working-directory: crypto-market-monitor-full-source
        run: node scripts/run-bybit-mt4-segment-validation.mjs --symbol ETHUSDT --min-hours 4800 --input archive/ETHUSDT-60m.csv --out validation-results/ETHUSDT.json

      - name: Print summaries
        if: always()
        working-directory: crypto-market-monitor-full-source
        shell: bash
        run: |
          shopt -s nullglob
          for f in validation-results/*.json; do
            echo "===== $f ====="
            cat "$f"
          done

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algo-v2-bybit-mt4-60m-segment-validation
          path: crypto-market-monitor-full-source/validation-results/*.json
          if-no-files-found: warn
